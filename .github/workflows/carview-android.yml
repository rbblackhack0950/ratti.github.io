name: CarView Android build

on:
  push:
    paths:
      - "carview/**"
      - ".github/workflows/carview-android.yml"
  pull_request:
    paths:
      - "carview/**"
      - ".github/workflows/carview-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarView-debug-apk
          path: carview/app/build/outputs/apk/debug/*.apk
