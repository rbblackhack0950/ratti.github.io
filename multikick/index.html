<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e0f">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Multi Kick Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="bar">
    <form id="add-form" autocomplete="off">
      <input id="add-input" type="text" inputmode="url" placeholder="วางลิงก์ Kick หรือชื่อช่อง (วางหลายอันได้)" aria-label="ลิงก์หรือชื่อช่อง">
      <button type="submit">เพิ่ม</button>
    </form>
    <div class="actions">
      <span id="count">0/8</span>
      <button id="share" type="button" title="คัดลอกลิงก์ที่แชร์ได้">แชร์</button>
      <button id="clear" type="button" title="ลบทุกช่อง">ล้าง</button>
      <button id="hide-bar" type="button" title="ซ่อนแถบ">▲</button>
    </div>
  </header>
  <button id="show-bar" type="button" hidden>▼</button>

  <main id="grid"></main>
  <p id="empty">วางลิงก์ช่อง Kick ด้านบนเพื่อเริ่มดู (สูงสุด 8 ช่อง)</p>
  <div id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
